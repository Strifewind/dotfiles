# =============================================================================
# ~/.tmux.conf — managed by chezmoi (dotfiles core). Edit in place (symlink).
# Style: navy and steel · vivid accents · FiraCode-friendly
# =============================================================================

# =============================================================================
# GENERAL
# =============================================================================

# Prefix: C-\  (C-b and C-a both released back to the shell / Emacs)
# Verify after reload with:  tmux show -g prefix   →  prefix C-\
unbind C-b
unbind C-a
set -g prefix C-\\
bind C-\\ send-prefix

# True color — TERM *inside* tmux is tmux-256color; the feature line below
# describes the terminal on the OUTSIDE (Windows Terminal reports xterm-256color).
set -g default-terminal "tmux-256color"
# -q: older tmux (shared servers) lacks terminal-features (3.2+); skip quietly there
set -asq terminal-features ",xterm-256color:RGB"

# Reduce escape time (crucial for Emacs/vim in tmux)
set -sg escape-time 10

# Increase scrollback
set -g history-limit 50000

# Window index starts at 1 (more natural on keyboard)
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on           # fill gaps when windows close

# Focus events (lets Emacs know when a buffer gets focus)
set -g focus-events on

# Mouse support — scroll and click to select pane/window
set -g mouse on

# Don't rename windows automatically
set -g allow-rename off

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off           # no bell, just subtle highlight

# --- Clipboard (OSC 52 → Windows clipboard over SSH) ---
# 'external' = tmux may set the outer clipboard, but programs inside a pane may not.
# Keep it external on a bastion: 'on' would let anything writing to a pane set your
# Windows clipboard. Verify Ms is present with:  tmux info | grep Ms:
set -s set-clipboard external

# Keeps SSH_TTY fresh across detach/reattach — required for Emacs clipetty to work
# after you reconnect to an existing session.
set -ga update-environment 'SSH_TTY'

# =============================================================================
# KEY BINDINGS
# =============================================================================

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Split panes — more intuitive keys, open in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Explicitly remove old C-hjkl pane nav so reloads stay clean
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l

# Pane navigation, no prefix — C-M-hjkl belongs to tmux.
# Plain C-hjkl is deliberately left alone so Emacs keeps kill-line, recenter, help.
bind -n C-M-h select-pane -L
bind -n C-M-j select-pane -D
bind -n C-M-k select-pane -U
bind -n C-M-l select-pane -R

# Pane resizing — prefix then Shift-hjkl, repeatable
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching — prefix then n/p, repeatable
bind -r n next-window
bind -r p previous-window
bind Tab last-window

# Kill without confirmation prompt (no "are you sure?" — be deliberate)
bind x kill-pane
bind X kill-window

# Copy mode — emacs keys: prefix [ to enter, C-Space to mark, M-w to copy
setw -g mode-keys emacs

# Session management
bind S choose-session
bind N new-session

# =============================================================================
# APPEARANCE — steel palette
#
# Color reference:
#   #1a1f2e  — deep navy (status bg)
#   #252b3a  — steel gray (inactive)
#   #0d70d0  — vivid blue (active window)
#   #f0883e  — amber orange (prefix indicator, activity)
#   #3fb950  — green (hostname, sync indicator)
#   #8b949e  — muted text
#   #c9d1d9  — primary text
# =============================================================================

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# Status bar background / default colors
set -g status-style "bg=#1a1f2e,fg=#c9d1d9"

# Left section: session name.
# Turns amber while the prefix is held — native, no plugin needed.
set -g status-left-length 40
set -g status-left "#[bg=#{?client_prefix,#f0883e,#0d70d0},fg=#ffffff,bold] #S #[bg=#1a1f2e,fg=#{?client_prefix,#f0883e,#0d70d0}]  "

# Right section: [SYNC] · host · date · time
# The sync badge is a format conditional, so it can never drift out of sync
# with the real pane state the way a set-option toggle can.
set -g status-right-length 100
set -g status-right "#{?pane_synchronized,#[bg=#f0883e#,fg=#1a1f2e#,bold] SYNC #[default] ,}#[fg=#3fb950]#H#[fg=#8b949e]  %a %d %b  #[fg=#c9d1d9]%H:%M"

# Window tabs — inactive
setw -g window-status-style "bg=#1a1f2e,fg=#8b949e"
setw -g window-status-format " #I #W "

# Window tabs — active
setw -g window-status-current-style "bg=#252b3a,fg=#c9d1d9,bold"
setw -g window-status-current-format "#[fg=#0d70d0] #I #[fg=#c9d1d9]#W "

# Window with activity
setw -g window-status-activity-style "bg=#1a1f2e,fg=#f0883e"

# Pane borders
set -g pane-border-style "fg=#252b3a"
set -g pane-active-border-style "fg=#0d70d0"

# Pane number display (prefix q)
set -g display-panes-colour "#8b949e"
set -g display-panes-active-colour "#0d70d0"

# Clock (prefix t)
setw -g clock-mode-colour "#0d70d0"
setw -g clock-mode-style 24

# Message / command line
set -g message-style "bg=#f0883e,fg=#1a1f2e,bold"
set -g message-command-style "bg=#252b3a,fg=#c9d1d9"

# Copy mode highlight
setw -g mode-style "bg=#f0883e,fg=#1a1f2e"

# =============================================================================
# SYNC PANES
# Toggle with: prefix y — the SYNC badge in status-right lights up automatically
# (see the status-right format conditional above).
# =============================================================================
bind y setw synchronize-panes
